name: Dashboard taeglich aktualisieren

on:
  # GitHub fuehrt Zeitplaene nur "nach Moeglichkeit" aus. Im August 2026 kamen die Laeufe
  # erst 45-115 Min zu spaet, am 27.08. um 11 Std, am 28.08. gar nicht -- das Dashboard war
  # dann einen ganzen Tag alt. Deshalb mehrere Anlaeufe ueber den Tag verteilt: faellt einer
  # aus, faengt der naechste es auf.
  #
  # Warum NICHT stuendlich: Die Daten aendern sich nur einmal taeglich. Das Ads-Script
  # schreibt zwischen 04:00-05:00 UTC ins Sheet, GA4 liefert Zahlen bis "gestern",
  # Search Console hinkt drei Tage hinterher. 24 Laeufe wuerden 23-mal dasselbe bauen --
  # und im Fehlerfall 24 Meldungen pro Tag erzeugen, in denen ein echtes Problem untergeht.
  schedule:
    - cron: '12 6 * * *'    # 06:12 UTC = ~08:12 DE -- Hauptlauf, nach dem Ads-Script
    - cron: '12 9 * * *'    # ~11:12 DE -- faengt einen verschluckten Hauptlauf auf
    - cron: '12 13 * * *'   # ~15:12 DE
    - cron: '12 17 * * *'   # ~19:12 DE -- letzte Chance des Tages
  workflow_dispatch:        # erlaubt manuelles Starten per Knopf
  push:
    branches: [main]        # bei Code-Aenderungen sofort neu veroeffentlichen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Zahlen holen und Seite bauen
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
        run: |
          node fetch-all.js
          node generate.js
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp stax-icon.svg stax-icon-vollflaechig.svg stax-icon-maskable.svg stax-manifest.webmanifest sw.js _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
